workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      groups:
        - "app variables"
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "us.iGadget.app"
        APP_STORE_CONNECT_KEY_ID: $APP_STORE_CONNECT_KEY_ID
        APP_STORE_CONNECT_ISSUER_ID: $APP_STORE_CONNECT_ISSUER_ID
        APP_STORE_CONNECT_PRIVATE_KEY: $APP_STORE_CONNECT_PRIVATE_KEY
        APPLE_TEAM_ID: $APPLE_TEAM_ID
        APN_PRIVATE_KEY: $APN_PRIVATE_KEY
        APN_KEY_ID: $APN_KEY_ID
        APN_TEAM_ID: $APN_TEAM_ID
        FIREBASE_API_KEY: $FIREBASE_API_KEY
        FIREBASE_AUTH_DOMAIN: $FIREBASE_AUTH_DOMAIN
        FIREBASE_PROJECT_ID: $FIREBASE_PROJECT_ID
        FIREBASE_STORAGE_BUCKET: $FIREBASE_STORAGE_BUCKET
        FIREBASE_MESSAGING_SENDER_ID: $FIREBASE_MESSAGING_SENDER_ID
        FIREBASE_APP_ID: $FIREBASE_APP_ID
      cocoapods: default
      xcode: latest
      
    scripts: 
      - name: Install Ruby 3.2.2 & Set as Default
        script: |
          # Install rbenv and ruby-build
          brew install rbenv ruby-build

          # Initialize rbenv
          eval "$(rbenv init -)"

          # Install Ruby 3.2.2
          rbenv install 3.2.2

          # Set Ruby 3.2.2 as the default version for this session
          rbenv global 3.2.2

          # Verify the installed version
          ruby -v

      - name: Install dependencies & Sync Capacitor
        script: |
          cd frontend
          npm install
          npx cap sync ios

      - name: Install CocoaPods & Dependencies
        script: |
          # Pin CocoaPods to avoid Ruby mismatch issues
          sudo gem install securerandom -v 0.3.2
          sudo gem install cocoapods -v 1.11.3

          if [ -d "Frontend/ios/App" ]; then
            cd Frontend/ios/App
          else
            echo "❌ ERROR: iOS directory not found!"
            exit 1
          fi

          # Run pod install in the correct location
          pod install --repo-update

      - name: Debug env
        script: |
          echo "PROVISIONING_PROFILE length: ${#PROVISIONING_PROFILE}"
          echo "First few characters of PROVISIONING_PROFILE:"
          echo "$PROVISIONING_PROFILE" | head -c 200

      - name: Install provisioning profile
        script: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo $PROVISIONING_PROFILE | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

      - name: Debug P12 Certificate
        script: |
          echo "P12_CERTIFICATE length: ${#P12_CERTIFICATE}"
          echo "First few characters of P12_CERTIFICATE:"
          echo "$P12_CERTIFICATE" | head -c 200

      - name: Install certificate
        script: |
          echo $P12_CERTIFICATE | base64 --decode > cert.p12
          security import cert.p12 -P $CERTIFICATE_PASSWORD -A -t cert -f pkcs12 -k login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k $CERTIFICATE_PASSWORD login.keychain-db
          security find-identity -v -p codesigning

      - name: Prepare App Store Connect Key
        script: |
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_PRIVATE_KEY" | awk '{gsub(/\r/, ""); print}' > ~/private_keys/AuthKey.p8
          chmod 600 ~/private_keys/AuthKey.p8
          echo "Stored authentication key content (first 10 lines):"
          head -n 10 ~/private_keys/AuthKey.p8
          echo "End of AuthKey.p8 content"

      - name: Check Private Key Readability
        script: |
          ls -l ~/private_keys/AuthKey.p8
          cat ~/private_keys/AuthKey.p8 | head -n 10

      - name: Debug Environment Variables
        script: |
          echo "Key ID: '$APP_STORE_CONNECT_KEY_ID'"
          echo "Issuer ID: '$APP_STORE_CONNECT_ISSUER_ID'"

      - name: Debug APNs & Firebase
        script: |
          echo "APN_KEY_ID: $APN_KEY_ID"
          echo "APN_TEAM_ID: $APN_TEAM_ID"
          echo "Checking APN_PRIVATE_KEY content (first 5 lines):"
          echo "$APN_PRIVATE_KEY" | head -n 5
          echo "Fetching Firebase Device Token..."
          npx cap run ios --target=device --verbose

      - name: Archive iOS
        script: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath $PWD/build/App.xcarchive \
            -destination 'generic/platform=iOS' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE_SPECIFIER="iGadget App Store Profile" \
            CODE_SIGN_IDENTITY="Apple Distribution: Mitch Furrier (Team ID)" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -verbose \
            clean archive

      - name: Export IPA
        script: |
          # Create an ExportOptions.plist on the fly (or reference one from your repo)
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" \
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <!-- This must match your Bundle ID and the *Name* of the provisioning profile 
                  exactly as it appears in the Apple Developer portal. -->
              <key>us.iGadget.app</key>
              <string>iGadget App Store Profile</string>
            </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $PWD/build/App.xcarchive \
            -exportPath $PWD/build \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey.p8" \
            -authenticationKeyID "$APP_STORE_CONNECT_KEY_ID" \
            -authenticationKeyIssuerID "$APP_STORE_CONNECT_ISSUER_ID" \
            -verbose
            
    artifacts:
      - build/*.ipa

publishing:
  app_store_connect:
    key_id: "$APP_STORE_CONNECT_KEY_ID"
    issuer_id: "$APP_STORE_CONNECT_ISSUER_ID"

    # If your private key is multiline, use the block scalar (|).
    private_key: |
      $APP_STORE_CONNECT_PRIVATE_KEY

    # Force this to be a string, rather than a bare boolean
    submit_to_app_store: "true"
