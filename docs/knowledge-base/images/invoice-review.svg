<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Property manager Invoice Review</title>
  <desc id="desc">Illustrated Invoice Review page with numbered callouts for invoice details, View Invoice PDF, decline reason, approval, and decline controls.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#19263d" flood-opacity=".10"/></filter></defs>
  <rect width="1200" height="760" fill="#f4f6f9"/>
  <text x="112" y="55" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087df5">← Billing</text>
  <text x="112" y="98" font-family="Arial, sans-serif" font-size="13" fill="#687386">Property manager review</text>
  <text x="112" y="140" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#172033">Invoice Review</text>
  <text x="112" y="171" font-family="Arial, sans-serif" font-size="15" fill="#687386">Review the contractor invoice before sending it to accounts payable.</text>
  <rect x="852" y="31" width="236" height="28" rx="6" fill="#fff7e8"/>
  <text x="970" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8" fill="#8a5a18">ILLUSTRATION · FICTIONAL DATA</text>
  <line x1="112" y1="198" x2="1088" y2="198" stroke="#dfe4eb"/>

  <rect x="112" y="228" width="976" height="462" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="146" y="275" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">Cedar Ridge Offices</text>
  <text x="146" y="303" font-family="Arial, sans-serif" font-size="14" fill="#687386">Invoice CR-204-1785792600</text>
  <text x="1042" y="281" text-anchor="end" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#172033">$145.00</text>
  <line x1="146" y1="328" x2="1054" y2="328" stroke="#dfe4eb"/>

  <g font-family="Arial, sans-serif">
    <text x="146" y="362" font-size="12" font-weight="700" fill="#687386">PROPERTY CODE</text><text x="146" y="385" font-size="14" fill="#172033">CR-204</text>
    <text x="355" y="362" font-size="12" font-weight="700" fill="#687386">INSPECTION DATE</text><text x="355" y="385" font-size="14" fill="#172033">8/3/2026</text>
    <text x="574" y="362" font-size="12" font-weight="700" fill="#687386">SUBMITTED BY</text><text x="574" y="385" font-size="14" fill="#172033">Alex Operator</text>
    <text x="790" y="362" font-size="12" font-weight="700" fill="#687386">AP METHOD</text><text x="790" y="385" font-size="14" fill="#172033">email</text>
    <text x="948" y="362" font-size="12" font-weight="700" fill="#687386">STATUS</text><text x="948" y="385" font-size="14" fill="#172033">pending review</text>
  </g>
  <rect x="146" y="420" width="150" height="42" rx="7" fill="#ffffff" stroke="#087df5"/>
  <text x="221" y="447" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#087df5">View Invoice PDF</text>

  <text x="146" y="505" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">Decline reason</text>
  <rect x="146" y="518" width="908" height="78" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="163" y="546" font-family="Arial, sans-serif" font-size="13" fill="#9aa4b2">Only required when declining.</text>

  <rect x="146" y="622" width="188" height="46" rx="8" fill="#087df5"/>
  <text x="240" y="651" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Approve &amp; Send to AP</text>
  <rect x="350" y="622" width="148" height="46" rx="8" fill="#c93645"/>
  <text x="424" y="651" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Decline Invoice</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="1052" cy="327" r="18" fill="#f26a21"/><text x="1052" y="333" fill="#ffffff">1</text>
    <circle cx="296" cy="420" r="18" fill="#f26a21"/><text x="296" y="426" fill="#ffffff">2</text>
    <circle cx="1053" cy="518" r="18" fill="#f26a21"/><text x="1053" y="524" fill="#ffffff">3</text>
    <circle cx="333" cy="622" r="18" fill="#f26a21"/><text x="333" y="628" fill="#ffffff">4</text>
    <circle cx="498" cy="622" r="18" fill="#f26a21"/><text x="498" y="628" fill="#ffffff">5</text>
  </g>
</svg>
