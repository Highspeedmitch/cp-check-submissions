<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Property manager Dashboard</title>
  <desc id="desc">Illustrated property manager Dashboard with numbered callouts for property search, new activity, and View Submissions.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#19263d" flood-opacity=".10"/></filter></defs>
  <rect width="1200" height="720" fill="#f4f6f9"/>
  <rect width="224" height="720" fill="#ffffff" stroke="#dfe4eb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">Northstar PM</text>
  <text x="30" y="100" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#687386">WORKSPACE</text>
  <rect x="20" y="115" width="184" height="44" rx="8" fill="#087df5"/>
  <text x="36" y="143" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Dashboard</text>
  <text x="36" y="194" font-family="Arial, sans-serif" font-size="15" fill="#172033">Reporting</text>
  <text x="36" y="240" font-family="Arial, sans-serif" font-size="15" fill="#172033">Billing</text>
  <text x="30" y="300" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2" fill="#687386">FIND A PROPERTY</text>
  <text x="30" y="333" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#687386">Search</text>
  <rect x="30" y="344" width="174" height="42" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="42" y="370" font-family="Arial, sans-serif" font-size="13" fill="#9aa4b2">Property name</text>
  <text x="30" y="420" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#687386">Region</text>
  <rect x="30" y="432" width="174" height="42" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="42" y="458" font-family="Arial, sans-serif" font-size="13" fill="#172033">All regions</text>
  <rect x="30" y="486" width="104" height="38" rx="7" fill="#ffffff" stroke="#087df5"/>
  <text x="82" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#087df5">Apply filter</text>

  <text x="286" y="48" font-family="Arial, sans-serif" font-size="13" fill="#687386">Working on behalf of Northstar PM</text>
  <text x="286" y="92" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#172033">Dashboard</text>
  <line x1="286" y1="118" x2="1144" y2="118" stroke="#dfe4eb"/>
  <rect x="904" y="22" width="240" height="28" rx="6" fill="#fff7e8"/>
  <text x="1024" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8" fill="#8a5a18">ILLUSTRATION · FICTIONAL DATA</text>
  <text x="286" y="172" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">All Managed Properties</text>
  <text x="286" y="199" font-family="Arial, sans-serif" font-size="15" fill="#687386">Review inspections and property activity.</text>

  <rect x="286" y="225" width="405" height="212" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="316" y="270" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Cedar Ridge Offices</text>
  <text x="316" y="298" font-family="Arial, sans-serif" font-size="14" fill="#687386">Inspection history and property activity</text>
  <rect x="592" y="251" width="66" height="30" rx="15" fill="#e8f6ed"/>
  <text x="625" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#207a48">New!</text>
  <rect x="316" y="342" width="158" height="46" rx="8" fill="#087df5"/>
  <text x="395" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">View Submissions</text>
  <rect x="716" y="225" width="405" height="212" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="746" y="270" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#172033">Harbor Point Annex</text>
  <text x="746" y="298" font-family="Arial, sans-serif" font-size="14" fill="#687386">Inspection history and property activity</text>
  <rect x="1022" y="251" width="72" height="30" rx="15" fill="#edf5ff"/>
  <text x="1058" y="271" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#0566ca">Managed</text>
  <rect x="746" y="342" width="158" height="46" rx="8" fill="#087df5"/>
  <text x="825" y="371" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">View Submissions</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="203" cy="343" r="18" fill="#f26a21"/><text x="203" y="349" fill="#ffffff">1</text>
    <circle cx="657" cy="250" r="18" fill="#f26a21"/><text x="657" y="256" fill="#ffffff">2</text>
    <circle cx="474" cy="342" r="18" fill="#f26a21"/><text x="474" y="348" fill="#ffffff">3</text>
  </g>
</svg>
