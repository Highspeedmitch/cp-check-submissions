  <text x="954" y="243" font-family="Arial, sans-serif" font-size="14" fill="#172033">12 months</text>
  <path d="M1076 233 l8 8 8-8" fill="none" stroke="#687386" stroke-width="2"/>

  <rect x="96" y="306" width="1008" height="280" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <g font-family="Arial, sans-serif">
    <text x="126" y="353" font-size="15" font-weight="700" fill="#172033">8/3/2026</text><text x="126" y="376" font-size="12" fill="#687386">3:14 PM</text>
    <rect x="914" y="331" width="154" height="43" rx="7" fill="#ffffff" stroke="#087df5"/><text x="991" y="358" text-anchor="middle" font-size="13" font-weight="700" fill="#087df5">View PDF</text>
