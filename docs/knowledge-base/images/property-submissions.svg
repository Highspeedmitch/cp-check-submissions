    <text x="126" y="447" font-size="15" font-weight="700" fill="#172033">7/18/2026</text><text x="126" y="470" font-size="12" fill="#687386">10:42 AM</text>
    <rect x="914" y="425" width="154" height="43" rx="7" fill="#ffffff" stroke="#087df5"/><text x="991" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#087df5">View PDF</text>
