<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Property inspection submission history</title>
  <desc id="desc">Illustrated property submission page with numbered callouts for the date-range filter and View PDF links.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#19263d" flood-opacity=".10"/></filter></defs>
  <rect width="1200" height="690" fill="#f4f6f9"/>
  <text x="96" y="54" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087df5">← Dashboard</text>
  <text x="96" y="95" font-family="Arial, sans-serif" font-size="13" fill="#687386">Property activity</text>
  <text x="96" y="138" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#172033">Cedar Ridge Offices</text>
  <text x="96" y="168" font-family="Arial, sans-serif" font-size="15" fill="#687386">Inspection submissions</text>
  <rect x="868" y="31" width="236" height="28" rx="6" fill="#fff7e8"/>
