<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Submitter Dashboard and assignment card</title>
  <desc id="desc">Illustrated Afterlight Dashboard with numbered callouts for the assignment, special instructions, and Start Inspection button.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#19263d" flood-opacity=".10"/></filter>
  </defs>
  <rect width="1200" height="720" fill="#f4f6f9"/>
  <rect width="224" height="720" fill="#ffffff" stroke="#dfe4eb"/>
  <text x="28" y="48" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">Northstar PM</text>
  <text x="30" y="104" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#687386">WORKSPACE</text>
  <rect x="20" y="119" width="184" height="44" rx="8" fill="#087df5"/>
  <text x="36" y="147" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Dashboard</text>
  <rect x="20" y="172" width="184" height="42" rx="8" fill="#ffffff"/>
  <text x="36" y="199" font-family="Arial, sans-serif" font-size="15" fill="#172033">Billing</text>
  <line x1="20" y1="614" x2="204" y2="614" stroke="#dfe4eb"/>
  <text x="30" y="651" font-family="Arial, sans-serif" font-size="14" fill="#687386">Light theme</text>
  <text x="30" y="686" font-family="Arial, sans-serif" font-size="14" fill="#c93645">Log out</text>

  <text x="286" y="48" font-family="Arial, sans-serif" font-size="13" fill="#687386">Working on behalf of Northstar PM</text>
  <text x="286" y="92" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#172033">Dashboard</text>
  <line x1="286" y1="118" x2="1144" y2="118" stroke="#dfe4eb"/>
  <rect x="904" y="22" width="240" height="28" rx="6" fill="#fff7e8"/>
  <text x="1024" y="41" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8" fill="#8a5a18">ILLUSTRATION · FICTIONAL DATA</text>

  <text x="286" y="171" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">My Assignments</text>
  <text x="286" y="197" font-family="Arial, sans-serif" font-size="15" fill="#687386">Your scheduled property work.</text>

  <rect x="286" y="221" width="660" height="300" rx="12" fill="#ffffff" filter="url(#shadow)"/>
  <text x="316" y="265" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Cedar Ridge Offices</text>
  <text x="316" y="292" font-family="Arial, sans-serif" font-size="15" fill="#687386">8/3/2026</text>
  <rect x="802" y="247" width="112" height="30" rx="15" fill="#fff0e7"/>
  <text x="858" y="267" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#a64b1d">Scheduled</text>

  <rect x="316" y="320" width="600" height="92" rx="8" fill="#fff0e7"/>
  <rect x="316" y="320" width="5" height="92" rx="2" fill="#a64b1d"/>
  <text x="341" y="350" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">Special instructions</text>
  <text x="341" y="378" font-family="Arial, sans-serif" font-size="14" fill="#172033">Check the third-floor mechanical room and photograph any active leaks.</text>

  <rect x="316" y="442" width="158" height="48" rx="8" fill="#087df5"/>
  <text x="395" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Start Inspection</text>
  <rect x="489" y="442" width="116" height="48" rx="8" fill="#ffffff" stroke="#087df5"/>
  <text x="547" y="472" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#087df5">Navigate</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="292" cy="278" r="18" fill="#f26a21"/><text x="292" y="284" fill="#ffffff">1</text>
    <circle cx="916" cy="334" r="18" fill="#f26a21"/><text x="916" y="340" fill="#ffffff">2</text>
    <circle cx="474" cy="476" r="18" fill="#f26a21"/><text x="474" y="482" fill="#ffffff">3</text>
  </g>

  <text x="286" y="584" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#172033">All Properties</text>
  <text x="286" y="610" font-family="Arial, sans-serif" font-size="15" fill="#687386">Select a property to begin an inspection.</text>
  <rect x="286" y="632" width="318" height="62" rx="10" fill="#ffffff" stroke="#dfe4eb"/>
  <text x="306" y="660" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#172033">Harbor Point Annex</text>
  <text x="306" y="681" font-family="Arial, sans-serif" font-size="12" fill="#687386">Property inspection checklist</text>
</svg>
