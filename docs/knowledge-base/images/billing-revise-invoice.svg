<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="680" viewBox="0 0 1300 680" role="img" aria-labelledby="title desc">
  <title id="title">Billing page with a declined invoice</title>
  <desc id="desc">Illustrated Field Operator Billing view with numbered callouts for Needs Revision status, decline reason, amount, Save Amount, and Review PDF.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#19263d" flood-opacity=".09"/></filter></defs>
  <rect width="1300" height="680" fill="#f4f6f9"/>
  <text x="74" y="56" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087df5">← Dashboard</text>
  <text x="74" y="108" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#172033">Billing</text>
  <text x="74" y="137" font-family="Arial, sans-serif" font-size="15" fill="#687386">My contractor invoices</text>
  <rect x="990" y="28" width="236" height="28" rx="6" fill="#fff7e8"/>
  <text x="1108" y="47" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8" fill="#8a5a18">ILLUSTRATION · FICTIONAL DATA</text>
  <line x1="74" y1="166" x2="1226" y2="166" stroke="#dfe4eb"/>
  <text x="74" y="214" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">Invoices</text>
  <rect x="74" y="241" width="58" height="38" rx="7" fill="#087df5"/>
  <text x="103" y="266" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">All</text>
  <text x="74" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#687386">STATUS</text>
  <rect x="74" y="334" width="220" height="42" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="91" y="360" font-family="Arial, sans-serif" font-size="14" fill="#172033">Needs revision</text>

  <rect x="74" y="408" width="1152" height="205" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="74" y="408" width="1152" height="46" rx="10" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#687386">
    <text x="98" y="437">PROPERTY</text><text x="300" y="437">INSPECTION</text><text x="445" y="437">AMOUNT</text><text x="594" y="437">STATUS</text><text x="827" y="437">ACTIONS</text>
  </g>
  <text x="98" y="490" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">Cedar Ridge Offices</text>
  <text x="98" y="512" font-family="Arial, sans-serif" font-size="12" fill="#687386">CR-204</text>
  <text x="300" y="490" font-family="Arial, sans-serif" font-size="14" fill="#172033">8/3/2026</text>
  <rect x="440" y="470" width="116" height="40" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="455" y="495" font-family="Arial, sans-serif" font-size="14" fill="#172033">160.00</text>
  <rect x="594" y="470" width="120" height="28" rx="14" fill="#fff0f1"/>
  <text x="654" y="489" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#c93645">Needs Revision</text>
  <text x="594" y="526" font-family="Arial, sans-serif" font-size="12" fill="#687386">Amount should be $145.00 per the current rate.</text>
  <rect x="826" y="469" width="110" height="38" rx="7" fill="#ffffff" stroke="#087df5"/>
  <text x="881" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#087df5">Save Amount</text>
  <rect x="947" y="469" width="106" height="38" rx="7" fill="#ffffff" stroke="#087df5"/>
  <text x="1000" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#087df5">Review PDF</text>
  <rect x="1064" y="469" width="96" height="38" rx="7" fill="#ffffff" stroke="#087df5"/>
  <text x="1112" y="493" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#087df5">View PDF</text>
  <text x="98" y="574" font-family="Arial, sans-serif" font-size="12" fill="#687386">After saving the corrected amount, generate and review a replacement PDF before sending it again.</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="712" cy="468" r="18" fill="#f26a21"/><text x="712" y="474" fill="#ffffff">1</text>
    <circle cx="785" cy="528" r="18" fill="#f26a21"/><text x="785" y="534" fill="#ffffff">2</text>
    <circle cx="555" cy="470" r="18" fill="#f26a21"/><text x="555" y="476" fill="#ffffff">3</text>
    <circle cx="936" cy="469" r="18" fill="#f26a21"/><text x="936" y="475" fill="#ffffff">4</text>
    <circle cx="1054" cy="469" r="18" fill="#f26a21"/><text x="1054" y="475" fill="#ffffff">5</text>
  </g>
</svg>
