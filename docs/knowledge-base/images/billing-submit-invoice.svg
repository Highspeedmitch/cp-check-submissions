<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720" role="img" aria-labelledby="title desc">
  <title id="title">Field Operator Billing page with a draft invoice</title>
  <desc id="desc">Illustrated Afterlight Billing page with numbered callouts for Billing navigation, Draft status, amount entry, Review PDF, and Send for Approval.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#19263d" flood-opacity=".09"/></filter></defs>
  <rect width="1400" height="720" fill="#f4f6f9"/>
  <g transform="translate(-130 0)">
  <text x="278" y="48" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087df5">← Dashboard</text>
  <text x="278" y="98" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#172033">Billing</text>
  <text x="278" y="127" font-family="Arial, sans-serif" font-size="15" fill="#687386">My contractor invoices</text>
  <rect x="1128" y="25" width="236" height="28" rx="6" fill="#fff7e8"/>
  <text x="1246" y="44" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8" fill="#8a5a18">ILLUSTRATION · FICTIONAL DATA</text>
  <line x1="278" y1="153" x2="1364" y2="153" stroke="#dfe4eb"/>
