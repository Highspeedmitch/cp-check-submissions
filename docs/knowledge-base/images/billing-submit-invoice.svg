    <circle cx="834" cy="479" r="18" fill="#f26a21"/><text x="834" y="485" fill="#ffffff">2</text>
    <circle cx="733" cy="518" r="18" fill="#f26a21"/><text x="733" y="524" fill="#ffffff">3</text>
    <circle cx="1234" cy="478" r="18" fill="#f26a21"/><text x="1234" y="484" fill="#ffffff">4</text>
    <circle cx="1171" cy="552" r="18" fill="#f26a21"/><text x="1171" y="558" fill="#ffffff">5</text>
