  </g>
  <text x="300" y="497" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">Cedar Ridge Offices</text>
  <text x="300" y="519" font-family="Arial, sans-serif" font-size="12" fill="#687386">CR-204</text>
  <text x="485" y="497" font-family="Arial, sans-serif" font-size="14" fill="#172033">8/3/2026</text>
  <rect x="620" y="478" width="112" height="40" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="635" y="503" font-family="Arial, sans-serif" font-size="14" fill="#172033">145.00</text>
  <rect x="767" y="480" width="68" height="28" rx="14" fill="#edf5ff"/>
  <text x="801" y="499" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#0566ca">Draft</text>
  <text x="892" y="497" font-family="Arial, sans-serif" font-size="14" fill="#172033">email</text>
  <rect x="1008" y="477" width="110" height="38" rx="7" fill="#ffffff" stroke="#087df5"/>
  <text x="1063" y="501" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#087df5">Save Amount</text>
  <rect x="1127" y="477" width="106" height="38" rx="7" fill="#ffffff" stroke="#087df5"/>
  <text x="1180" y="501" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#087df5">Review PDF</text>
