  <text x="278" y="227" font-family="Arial, sans-serif" font-size="14" fill="#687386">1 invoice in this view</text>
  <rect x="278" y="253" width="56" height="38" rx="7" fill="#087df5"/>
  <text x="306" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff">All</text>
  <text x="359" y="278" font-family="Arial, sans-serif" font-size="14" fill="#687386">Archived</text>
  <text x="278" y="329" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#687386">STATUS</text>
  <rect x="278" y="341" width="220" height="42" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="294" y="367" font-family="Arial, sans-serif" font-size="14" fill="#172033">All statuses</text>

  <rect x="278" y="413" width="1086" height="224" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="278" y="413" width="1086" height="48" rx="10" fill="#f8fafc"/>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#687386">
