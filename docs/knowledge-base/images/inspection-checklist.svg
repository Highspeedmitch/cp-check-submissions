<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Commercial property inspection checklist</title>
  <desc id="desc">Illustrated inspection form with numbered callouts for the property, instructions, required questions, photo follow-up, and Submit Checklist button.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#19263d" flood-opacity=".09"/></filter></defs>
  <rect width="1200" height="800" fill="#f4f6f9"/>
  <rect x="96" y="28" width="1008" height="744" rx="12" fill="#f4f6f9"/>
  <text x="112" y="66" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087df5">← Dashboard</text>
  <text x="112" y="107" font-family="Arial, sans-serif" font-size="13" fill="#687386">Cedar Ridge Offices</text>
  <text x="112" y="147" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#172033">Commercial Property Inspection Checklist</text>
  <text x="112" y="176" font-family="Arial, sans-serif" font-size="15" fill="#687386">Complete the property inspection and attach photos for any issues.</text>
  <rect x="852" y="42" width="236" height="28" rx="6" fill="#fff7e8"/>
  <text x="970" y="61" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8" fill="#8a5a18">ILLUSTRATION · FICTIONAL DATA</text>
  <line x1="112" y1="199" x2="1088" y2="199" stroke="#dfe4eb"/>

  <rect x="112" y="222" width="976" height="76" rx="8" fill="#fff0e7"/>
  <rect x="112" y="222" width="5" height="76" rx="2" fill="#a64b1d"/>
  <text x="138" y="250" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">Special assignment instructions</text>
  <text x="138" y="276" font-family="Arial, sans-serif" font-size="14" fill="#172033">Check the third-floor mechanical room and photograph any active leaks.</text>

  <rect x="112" y="321" width="976" height="371" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <text x="142" y="362" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#172033">Building Exterior</text>
  <text x="142" y="402" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#687386">Visible roof or gutter damage?</text>
  <rect x="142" y="416" width="368" height="44" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="160" y="444" font-family="Arial, sans-serif" font-size="14" fill="#172033">Yes</text>
  <path d="M484 433 l8 8 8-8" fill="none" stroke="#687386" stroke-width="2"/>

  <rect x="142" y="482" width="916" height="156" rx="8" fill="#edf5ff"/>
  <text x="166" y="514" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">Describe the issue</text>
  <rect x="166" y="527" width="410" height="76" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="180" y="551" font-family="Arial, sans-serif" font-size="13" fill="#687386">Loose gutter section above the west entrance.</text>
  <text x="622" y="514" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#172033">Photos for: Roof and gutters</text>
  <rect x="622" y="529" width="158" height="38" rx="7" fill="#ffffff" stroke="#b9c2cf"/>
  <text x="701" y="553" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#172033">Choose Files</text>
  <text x="622" y="591" font-family="Arial, sans-serif" font-size="12" fill="#687386">2 of 6 photos attached. Select again to add more.</text>
  <rect x="815" y="525" width="92" height="68" rx="6" fill="#c5d5e7"/>
  <path d="M823 577 l22-20 15 14 12-10 27 24" fill="none" stroke="#6b8099" stroke-width="5"/>
  <rect x="923" y="525" width="92" height="68" rx="6" fill="#d8e1ea"/>
  <path d="M932 578 l19-18 13 11 18-19 26 32" fill="none" stroke="#7890a7" stroke-width="5"/>

  <rect x="112" y="714" width="976" height="58" rx="10" fill="#ffffff" stroke="#dfe4eb"/>
  <rect x="876" y="724" width="190" height="40" rx="8" fill="#087df5"/>
  <text x="971" y="750" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff">Submit Checklist</text>

  <g font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
    <circle cx="105" cy="111" r="18" fill="#f26a21"/><text x="105" y="117" fill="#ffffff">1</text>
    <circle cx="1083" cy="235" r="18" fill="#f26a21"/><text x="1083" y="241" fill="#ffffff">2</text>
    <circle cx="508" cy="416" r="18" fill="#f26a21"/><text x="508" y="422" fill="#ffffff">3</text>
    <circle cx="1058" cy="523" r="18" fill="#f26a21"/><text x="1058" y="529" fill="#ffffff">4</text>
    <circle cx="1070" cy="743" r="18" fill="#f26a21"/><text x="1070" y="749" fill="#ffffff">5</text>
  </g>
</svg>
