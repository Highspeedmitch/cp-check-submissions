<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="900" viewBox="0 0 1300 900" role="img" aria-labelledby="title desc">
  <title id="title">Administrator Scheduler assignment form</title>
  <desc id="desc">Illustrated Scheduler page with numbered callouts for property, user, dates, one-time instructions, Create Assignment, and calendar.</desc>
  <defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#19263d" flood-opacity=".10"/></filter></defs>
  <rect width="1300" height="900" fill="#f4f6f9"/>
  <text x="74" y="50" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#087df5">← Return to Dashboard</text>
  <text x="74" y="97" font-family="Arial, sans-serif" font-size="13" fill="#687386">Admin tools</text>
  <text x="74" y="138" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#172033">Scheduler</text>
  <text x="74" y="168" font-family="Arial, sans-serif" font-size="15" fill="#687386">Create assignments and review upcoming property work.</text>
  <rect x="990" y="29" width="236" height="28" rx="6" fill="#fff7e8"/>
