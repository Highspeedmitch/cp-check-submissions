<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">Current Scheduler calendar and assignment editor</title>
  <desc id="desc">Illustrated dark-mode Scheduler showing assignment queues, visual calendar controls, and the create-assignment dialog with numbered callouts for property, fulfillment, user, dates, instructions, and creation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#02050a" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1400" height="1000" fill="#111722"/>
  <text x="70" y="48" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#2f98ff">&lt;- Return to Dashboard</text>
  <text x="70" y="91" font-family="Arial, sans-serif" font-size="13" fill="#9facbf">ADMIN TOOLS</text>
  <text x="70" y="132" font-family="Arial, sans-serif" font-size="38" font-weight="700" fill="#f7f9fc">Scheduler</text>
  <text x="70" y="162" font-family="Arial, sans-serif" font-size="15" fill="#aeb9c9">Create assignments and review upcoming property work.</text>
  <rect x="1120" y="36" width="214" height="29" rx="7" fill="#253044"/>
  <text x="1227" y="56" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing=".8" fill="#b9c7da">ILLUSTRATION - FICTIONAL DATA</text>
  <line x1="70" y1="190" x2="1330" y2="190" stroke="#334056"/>

  <g font-family="Arial, sans-serif">
    <rect x="70" y="215" width="390" height="95" rx="12" fill="#1d2635" stroke="#3c4a61"/>
    <text x="94" y="245" font-size="13" font-weight="700" fill="#9fb1c9">CUSTOMER ASSIGNED</text>
    <text x="424" y="264" text-anchor="end" font-size="32" font-weight="700" fill="#f7f9fc">4</text>
    <text x="94" y="281" font-size="13" fill="#aeb9c9">Customer employees and contractors</text>

    <rect x="480" y="215" width="390" height="95" rx="12" fill="#1d2635" stroke="#3c4a61"/>
    <text x="504" y="245" font-size="13" font-weight="700" fill="#9fb1c9">AFTERLIGHT COVERAGE</text>
    <text x="834" y="264" text-anchor="end" font-size="32" font-weight="700" fill="#f7f9fc">2</text>
    <text x="504" y="281" font-size="13" fill="#aeb9c9">Afterlight staff and contractor coverage</text>
  </g>

  <rect x="70" y="335" width="1260" height="590" rx="14" fill="#1a2230" stroke="#3b485e"/>
  <text x="96" y="370" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#8fa3bf">VISUAL SCHEDULING</text>
  <text x="96" y="403" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#f7f9fc">Assignment calendar</text>
  <text x="96" y="428" font-family="Arial, sans-serif" font-size="14" fill="#aeb9c9">Select a date or drag across a range to begin an assignment.</text>
  <rect x="1010" y="365" width="142" height="40" rx="8" fill="#222d3e" stroke="#52617a"/>
  <text x="1081" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e3e9f2">Assignment History</text>
  <rect x="1165" y="365" width="140" height="40" rx="8" fill="#248df0"/>
  <text x="1235" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">+ New Assignment</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#c3cfdf">
    <circle cx="102" cy="458" r="5" fill="#268ef1"/><text x="115" y="462">Customer assigned</text>
    <circle cx="245" cy="458" r="5" fill="#8c6ce7"/><text x="258" y="462">Afterlight coverage</text>
  </g>

  <rect x="96" y="482" width="58" height="34" rx="7" fill="#232e3e" stroke="#45536a"/>
  <text x="125" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#e3e9f2">Today</text>
  <rect x="162" y="482" width="34" height="34" rx="7" fill="#232e3e" stroke="#45536a"/>
  <text x="179" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#e3e9f2">&lt;</text>
  <rect x="204" y="482" width="34" height="34" rx="7" fill="#232e3e" stroke="#45536a"/>
  <text x="221" y="504" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#e3e9f2">&gt;</text>
  <text x="700" y="506" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#eef2f8">August 2026</text>
  <rect x="1120" y="482" width="60" height="34" rx="7" fill="#248df0"/>
  <text x="1150" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Month</text>
  <rect x="1188" y="482" width="50" height="34" rx="7" fill="#232e3e"/>
  <text x="1213" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d7deea">Week</text>
  <rect x="1246" y="482" width="59" height="34" rx="7" fill="#232e3e"/>
  <text x="1275" y="503" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#d7deea">Agenda</text>

  <g stroke="#3b475a" fill="none">
    <rect x="96" y="540" width="1208" height="350"/>
    <line x1="268" y1="540" x2="268" y2="890"/><line x1="440" y1="540" x2="440" y2="890"/>
    <line x1="612" y1="540" x2="612" y2="890"/><line x1="784" y1="540" x2="784" y2="890"/>
    <line x1="956" y1="540" x2="956" y2="890"/><line x1="1128" y1="540" x2="1128" y2="890"/>
    <line x1="96" y1="575" x2="1304" y2="575"/><line x1="96" y1="638" x2="1304" y2="638"/>
    <line x1="96" y1="701" x2="1304" y2="701"/><line x1="96" y1="764" x2="1304" y2="764"/>
    <line x1="96" y1="827" x2="1304" y2="827"/>
  </g>
  <g font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#aeb9c9" text-anchor="middle">
    <text x="182" y="563">SUN</text><text x="354" y="563">MON</text><text x="526" y="563">TUE</text>
    <text x="698" y="563">WED</text><text x="870" y="563">THU</text><text x="1042" y="563">FRI</text><text x="1216" y="563">SAT</text>
  </g>
  <rect x="270" y="649" width="328" height="36" rx="6" fill="#236da7"/>
  <text x="286" y="672" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#fff">Cedar Ridge Offices - alex@example.com</text>

  <rect x="0" y="0" width="1400" height="1000" fill="#060a10" opacity=".40"/>
  <rect x="350" y="195" width="700" height="750" rx="16" fill="#1e2736" stroke="#526079" filter="url(#shadow)"/>

  <text x="382" y="232" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1" fill="#8fa3bf">NEW ASSIGNMENT</text>
  <text x="382" y="268" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#f7f9fc">Create assignment</text>
  <text x="382" y="293" font-family="Arial, sans-serif" font-size="14" fill="#aeb9c9">Scheduled for August 12, 2026</text>
  <text x="1012" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" fill="#c3cfdf">x</text>
  <line x1="382" y1="316" x2="1018" y2="316" stroke="#39475c"/>

  <g font-family="Arial, sans-serif">
    <text x="382" y="354" font-size="12" font-weight="700" fill="#b9c7da">Property</text>
    <rect x="548" y="330" width="430" height="40" rx="7" fill="#242f40" stroke="#53627b"/>
    <text x="566" y="355" font-size="13" fill="#f2f5fa">Cedar Ridge Offices</text>

    <text x="382" y="406" font-size="12" font-weight="700" fill="#b9c7da">User</text>
    <rect x="548" y="382" width="430" height="40" rx="7" fill="#242f40" stroke="#53627b"/>
    <text x="566" y="407" font-size="13" fill="#f2f5fa">alex@example.com (user)</text>

    <text x="382" y="458" font-size="12" font-weight="700" fill="#b9c7da">Fulfillment</text>
    <rect x="548" y="434" width="430" height="40" rx="7" fill="#242f40" stroke="#53627b"/>
    <text x="566" y="459" font-size="13" fill="#f2f5fa">Use property default (Customer employee)</text>

    <text x="382" y="510" font-size="12" font-weight="700" fill="#b9c7da">Routing</text>
    <rect x="548" y="486" width="430" height="40" rx="7" fill="#242f40" stroke="#44536a"/>
    <text x="566" y="511" font-size="13" font-weight="700" fill="#f2f5fa">Customer Assigned</text>
    <text x="956" y="511" text-anchor="end" font-size="12" fill="#b5c2d4">No invoice</text>

    <text x="382" y="562" font-size="12" font-weight="700" fill="#b9c7da">Suggested client amount</text>
    <rect x="548" y="538" width="430" height="40" rx="7" fill="#242f40" stroke="#44536a"/>
    <text x="566" y="563" font-size="13" font-weight="700" fill="#f2f5fa">$225.00</text>
    <text x="956" y="563" text-anchor="end" font-size="12" fill="#b5c2d4">Property billing setting</text>

    <text x="382" y="614" font-size="12" font-weight="700" fill="#b9c7da">Start Date</text>
    <rect x="548" y="590" width="196" height="40" rx="7" fill="#242f40" stroke="#53627b"/>
    <text x="566" y="615" font-size="13" fill="#f2f5fa">08/12/2026</text>
    <text x="770" y="614" font-size="12" font-weight="700" fill="#b9c7da">End Date (optional)</text>
    <rect x="886" y="590" width="92" height="40" rx="7" fill="#242f40" stroke="#53627b"/>

    <text x="382" y="674" font-size="12" font-weight="700" fill="#b9c7da">One-Time Additional</text>
    <text x="382" y="691" font-size="12" font-weight="700" fill="#b9c7da">Check Request</text>
    <rect x="548" y="650" width="430" height="96" rx="7" fill="#242f40" stroke="#53627b"/>
    <text x="566" y="678" font-size="13" fill="#f2f5fa">Photograph the north stairwell and note</text>
    <text x="566" y="699" font-size="13" fill="#f2f5fa">any active lighting issues.</text>
  </g>

  <rect x="548" y="776" width="150" height="43" rx="8" fill="#248df0"/>
  <text x="623" y="803" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#fff">Create Assignment</text>
  <rect x="710" y="776" width="82" height="43" rx="8" fill="#263244" stroke="#52617a"/>
  <text x="751" y="803" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#e3e9f2">Close</text>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <circle cx="995" cy="330" r="17" fill="#f28a35"/><text x="995" y="336" fill="#fff">1</text>
    <circle cx="995" cy="434" r="17" fill="#f28a35"/><text x="995" y="440" fill="#fff">2</text>
    <circle cx="995" cy="382" r="17" fill="#f28a35"/><text x="995" y="388" fill="#fff">3</text>
    <circle cx="995" cy="590" r="17" fill="#f28a35"/><text x="995" y="596" fill="#fff">4</text>
    <circle cx="995" cy="650" r="17" fill="#f28a35"/><text x="995" y="656" fill="#fff">5</text>
    <circle cx="698" cy="776" r="17" fill="#f28a35"/><text x="698" y="782" fill="#fff">6</text>
  </g>

  <text x="700" y="974" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#95a6bd">Desktop illustration. On compact mobile screens, select a day and then choose + Create Assignment.</text>
</svg>
