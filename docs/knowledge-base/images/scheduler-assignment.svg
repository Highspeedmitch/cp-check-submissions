  <rect x="1005" y="632" width="64" height="34" rx="6" fill="#087df5"/><text x="1037" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Month</text>
  <rect x="1075" y="632" width="56" height="34" rx="6" fill="#ffffff" stroke="#b9c2cf"/><text x="1103" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172033">Week</text>
  <rect x="1137" y="632" width="66" height="34" rx="6" fill="#ffffff" stroke="#b9c2cf"/><text x="1170" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172033">Agenda</text>
  <g stroke="#dfe4eb"><line x1="98" y1="702" x2="1202" y2="702"/><line x1="98" y1="744" x2="1202" y2="744"/><line x1="98" y1="786" x2="1202" y2="786"/><line x1="98" y1="828" x2="1202" y2="828"/><line x1="256" y1="679" x2="256" y2="850"/><line x1="414" y1="679" x2="414" y2="850"/><line x1="572" y1="679" x2="572" y2="850"/><line x1="730" y1="679" x2="730" y2="850"/><line x1="888" y1="679" x2="888" y2="850"/><line x1="1046" y1="679" x2="1046" y2="850"/></g>
  <rect x="260" y="748" width="308" height="32" rx="5" fill="#087df5"/><text x="274" y="769" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Cedar Ridge Offices - alex.submitter@example.com</text>

