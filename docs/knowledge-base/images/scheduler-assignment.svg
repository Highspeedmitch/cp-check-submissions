    <rect x="270" y="282" width="420" height="42" rx="7" fill="#ffffff" stroke="#b9c2cf"/><text x="288" y="308" font-size="14" fill="#172033">Cedar Ridge Offices</text>
    <text x="114" y="361" font-size="13" font-weight="700" fill="#687386">User:</text>
    <rect x="270" y="334" width="420" height="42" rx="7" fill="#ffffff" stroke="#b9c2cf"/><text x="288" y="360" font-size="14" fill="#172033">alex.submitter@example.com</text>
    <text x="114" y="413" font-size="13" font-weight="700" fill="#687386">Start Date:</text>
    <rect x="270" y="386" width="190" height="42" rx="7" fill="#ffffff" stroke="#b9c2cf"/><text x="288" y="412" font-size="14" fill="#172033">08/03/2026</text>
    <text x="492" y="413" font-size="13" font-weight="700" fill="#687386">End Date:</text>
    <rect x="570" y="386" width="190" height="42" rx="7" fill="#ffffff" stroke="#b9c2cf"/><text x="588" y="412" font-size="14" fill="#172033">08/03/2026</text>
    <text x="114" y="467" font-size="13" font-weight="700" fill="#687386">One-Time Additional</text><text x="114" y="485" font-size="13" font-weight="700" fill="#687386">Check Request:</text>
    <rect x="270" y="447" width="706" height="72" rx="7" fill="#ffffff" stroke="#b9c2cf"/><text x="288" y="474" font-size="13" fill="#172033">Check the third-floor mechanical room and photograph any active leaks.</text>
  </g>
  <rect x="270" y="535" width="172" height="42" rx="8" fill="#087df5"/>
  <text x="356" y="562" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Create Assignment</text>

  <rect x="74" y="612" width="1152" height="258" rx="10" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="98" y="632" width="72" height="34" rx="6" fill="#ffffff" stroke="#b9c2cf"/><text x="134" y="654" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#172033">Today</text>
