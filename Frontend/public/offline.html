<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071a38" />
    <title>Afterlight is offline</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; background: #071a38; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
      main { width: min(100%, 440px); padding: 32px; border-radius: 20px; background: #fff; color: #14223a; box-shadow: 0 24px 70px rgba(0,0,0,.3); }
      h1 { margin-top: 0; } p { line-height: 1.55; color: #536179; }
      button { border: 0; border-radius: 10px; padding: 12px 18px; background: #1769e0; color: #fff; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <h1>Afterlight is offline</h1>
      <p>Your connection is unavailable. Reopen the app when service returns; supported inspection drafts remain saved on this device.</p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </main>
  </body>
</html>
