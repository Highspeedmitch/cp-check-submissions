AWSTemplateFormatVersion: "2010-09-09"
Description: Afterlight API and background worker health monitoring, alarms, and dashboard

Parameters:
  EnvironmentName:
    Type: String
    Default: production
    AllowedPattern: "^[a-z0-9-]+$"
    Description: Lowercase environment label used in monitoring resources
  ApiBaseUrl:
    Type: String
    Default: https://api.afterlightinspections.com
    AllowedPattern: "^https://[^/]+$"
    Description: Public API origin without a trailing slash
  CanaryName:
    Type: String
    Default: afterlight-prod-api
    AllowedPattern: "^[a-z0-9_-]{1,21}$"
    Description: CloudWatch Synthetics canary name
  CanaryRuntimeVersion:
    Type: String
    Default: syn-nodejs-puppeteer-15.0
    Description: Supported CloudWatch Synthetics Node.js runtime
  AlertEmail:
    Type: String
    Default: ""
    Description: Optional email address that must confirm the SNS subscription
  LatencyThresholdMilliseconds:
    Type: Number
    Default: 5000
    MinValue: 1000
    Description: P90 canary duration threshold in milliseconds
  WorkerMetricsNamespace:
    Type: String
    Default: Afterlight/Workers
    AllowedPattern: "^[A-Za-z0-9/._-]{1,255}$"
    Description: Custom CloudWatch namespace published by the application workers
  EnableWorkerMetricAlarms:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Create worker and queue alarms after DEV metric publication is verified
  MonitorMonthlyPortfolioWorker:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Monitor the monthly portfolio summary worker when it is enabled
  MonitorWarRoomNotificationWorker:
    Type: String
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    Description: Monitor the War Room notification worker when it is enabled
  WorkerQueueAgeThresholdSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    Description: Oldest queued item age that triggers an alert

Conditions:
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]
  WorkerMetricAlarmsEnabled: !Equals [!Ref EnableWorkerMetricAlarms, "true"]
  MonthlyWorkerAlarmEnabled: !And
    - !Condition WorkerMetricAlarmsEnabled
    - !Equals [!Ref MonitorMonthlyPortfolioWorker, "true"]
  WarRoomWorkerAlarmEnabled: !And
    - !Condition WorkerMetricAlarmsEnabled
    - !Equals [!Ref MonitorWarRoomNotificationWorker, "true"]

Resources:
  CanaryArtifactsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-canary-artifacts
            Status: Enabled
            ExpirationInDays: 90
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  CanaryExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: canary-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CanaryArtifacts
                Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt CanaryArtifactsBucket.Arn
              - Sid: CanaryArtifactObjects
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub "${CanaryArtifactsBucket.Arn}/*"
              - Sid: CanaryLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/cwsyn-*"
              - Sid: CanaryMetrics
                Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: CloudWatchSynthetics
              - Sid: CanaryTracing
                Effect: Allow
                Action:
                  - xray:PutTraceSegments
                  - xray:PutTelemetryRecords
                Resource: "*"

  CanaryArtifactsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CanaryArtifactsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt CanaryArtifactsBucket.Arn
              - !Sub "${CanaryArtifactsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  ApiHealthCanary:
    Type: AWS::Synthetics::Canary
    Properties:
      Name: !Ref CanaryName
      ArtifactS3Location: !Sub "s3://${CanaryArtifactsBucket}/artifacts"
      Code:
        Handler: index.handler
        Script: |
          const synthetics = require("Synthetics");
          const log = require("SyntheticsLogger");

          const handler = async () => {
            const page = await synthetics.getPage();
            const response = await page.goto(process.env.API_HEALTH_URL, {
              waitUntil: "domcontentloaded",
              timeout: 15000,
            });
            const status = response.status();
            if (status !== 200) {
              log.error("Health endpoint returned HTTP " + status);
              throw new Error("Expected HTTP 200, received " + status);
            }
            const payload = await response.json();
            if (payload.status !== "ok" || payload.service !== "afterlight-api") {
              throw new Error("Health endpoint returned an unexpected readiness payload");
            }
          };

          exports.handler = async () => synthetics.executeStep("api-health", handler);
      ExecutionRoleArn: !GetAtt CanaryExecutionRole.Arn
      RuntimeVersion: !Ref CanaryRuntimeVersion
      Schedule:
        Expression: rate(5 minutes)
        DurationInSeconds: "0"
      RunConfig:
        ActiveTracing: true
        EnvironmentVariables:
          API_HEALTH_URL: !Sub "${ApiBaseUrl}/health"
        TimeoutInSeconds: 60
      SuccessRetentionPeriod: 31
      FailureRetentionPeriod: 31
      StartCanaryAfterCreation: true
      ProvisionedResourceCleanup: AUTOMATIC

  HealthAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Afterlight production health alerts
      KmsMasterKeyId: alias/aws/sns
      TopicName: !Sub "afterlight-${EnvironmentName}-health-alerts"

  HealthAlertEmailSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref HealthAlertTopic

  CanaryAvailabilityAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "afterlight-${EnvironmentName}-api-availability"
      AlarmDescription: Afterlight API health checks are failing or missing
      Namespace: CloudWatchSynthetics
      MetricName: SuccessPercent
      Dimensions:
        - Name: CanaryName
          Value: !Ref ApiHealthCanary
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 90
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref HealthAlertTopic
      OKActions:
        - !Ref HealthAlertTopic

  CanaryLatencyAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "afterlight-${EnvironmentName}-api-latency"
      AlarmDescription: Afterlight API health check latency is elevated
      Namespace: CloudWatchSynthetics
      MetricName: Duration
      Dimensions:
        - Name: CanaryName
          Value: !Ref ApiHealthCanary
      ExtendedStatistic: p90
      Period: 300
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref LatencyThresholdMilliseconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref HealthAlertTopic
      OKActions:
        - !Ref HealthAlertTopic

  InspectionWorkerHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WorkerMetricAlarmsEnabled
    Properties:
      AlarmName: !Sub "afterlight-${EnvironmentName}-inspection-worker-health"
      AlarmDescription: Inspection worker heartbeat is unhealthy or missing
      Namespace: !Ref WorkerMetricsNamespace
      MetricName: WorkerHealthy
      Dimensions:
        - Name: Environment
          Value: !Ref EnvironmentName
        - Name: Worker
          Value: inspection
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref HealthAlertTopic
      OKActions:
        - !Ref HealthAlertTopic

  MonthlyPortfolioWorkerHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MonthlyWorkerAlarmEnabled
    Properties:
      AlarmName: !Sub "afterlight-${EnvironmentName}-monthly-worker-health"
      AlarmDescription: Monthly portfolio worker heartbeat is unhealthy or missing
      Namespace: !Ref WorkerMetricsNamespace
      MetricName: WorkerHealthy
      Dimensions:
        - Name: Environment
          Value: !Ref EnvironmentName
        - Name: Worker
          Value: monthly-portfolio-summary
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref HealthAlertTopic
      OKActions:
        - !Ref HealthAlertTopic

  WarRoomWorkerHealthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WarRoomWorkerAlarmEnabled
    Properties:
      AlarmName: !Sub "afterlight-${EnvironmentName}-war-room-worker-health"
      AlarmDescription: War Room notification worker heartbeat is unhealthy or missing
      Namespace: !Ref WorkerMetricsNamespace
      MetricName: WorkerHealthy
      Dimensions:
        - Name: Environment
          Value: !Ref EnvironmentName
        - Name: Worker
          Value: war-room-notification
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref HealthAlertTopic
      OKActions:
        - !Ref HealthAlertTopic

  InspectionQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WorkerMetricAlarmsEnabled
    Properties:
      AlarmName: !Sub "afterlight-${EnvironmentName}-inspection-queue-age"
      AlarmDescription: The oldest inspection job has waited beyond the reviewed threshold
      Namespace: !Ref WorkerMetricsNamespace
      MetricName: OldestQueuedAgeSeconds
      Dimensions:
        - Name: Environment
          Value: !Ref EnvironmentName
        - Name: Worker
          Value: inspection
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref WorkerQueueAgeThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref HealthAlertTopic
      OKActions:
        - !Ref HealthAlertTopic

  MonthlyPortfolioQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: MonthlyWorkerAlarmEnabled
    Properties:
      AlarmName: !Sub "afterlight-${EnvironmentName}-monthly-queue-age"
      AlarmDescription: The oldest monthly summary has waited beyond the reviewed threshold
      Namespace: !Ref WorkerMetricsNamespace
      MetricName: OldestQueuedAgeSeconds
      Dimensions:
        - Name: Environment
          Value: !Ref EnvironmentName
        - Name: Worker
          Value: monthly-portfolio-summary
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref WorkerQueueAgeThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref HealthAlertTopic
      OKActions:
        - !Ref HealthAlertTopic

  WarRoomQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: WarRoomWorkerAlarmEnabled
    Properties:
      AlarmName: !Sub "afterlight-${EnvironmentName}-war-room-queue-age"
      AlarmDescription: The oldest War Room event has waited beyond the reviewed threshold
      Namespace: !Ref WorkerMetricsNamespace
      MetricName: OldestQueuedAgeSeconds
      Dimensions:
        - Name: Environment
          Value: !Ref EnvironmentName
        - Name: Worker
          Value: war-room-notification
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 3
      DatapointsToAlarm: 2
      Threshold: !Ref WorkerQueueAgeThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref HealthAlertTopic
      OKActions:
        - !Ref HealthAlertTopic

  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "afterlight-${EnvironmentName}-health"
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "x": 0,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API health availability",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Average",
                "period": 300,
                "metrics": [
                  ["CloudWatchSynthetics", "SuccessPercent", "CanaryName", "${CanaryName}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 0,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "API health duration",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "p90",
                "period": 300,
                "metrics": [
                  ["CloudWatchSynthetics", "Duration", "CanaryName", "${CanaryName}"]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Worker health",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Minimum",
                "period": 60,
                "yAxis": { "left": { "min": 0, "max": 1 } },
                "metrics": [
                  ["${WorkerMetricsNamespace}", "WorkerHealthy", "Environment", "${EnvironmentName}", "Worker", "inspection", { "label": "Inspection" }],
                  ["${WorkerMetricsNamespace}", "WorkerHealthy", "Environment", "${EnvironmentName}", "Worker", "monthly-portfolio-summary", { "label": "Monthly portfolio" }],
                  ["${WorkerMetricsNamespace}", "WorkerHealthy", "Environment", "${EnvironmentName}", "Worker", "war-room-notification", { "label": "War Room" }]
                ]
              }
            },
            {
              "type": "metric",
              "x": 8,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Queue depth",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 60,
                "metrics": [
                  ["${WorkerMetricsNamespace}", "QueueDepth", "Environment", "${EnvironmentName}", "Worker", "inspection", { "label": "Inspection" }],
                  ["${WorkerMetricsNamespace}", "QueueDepth", "Environment", "${EnvironmentName}", "Worker", "monthly-portfolio-summary", { "label": "Monthly portfolio" }],
                  ["${WorkerMetricsNamespace}", "QueueDepth", "Environment", "${EnvironmentName}", "Worker", "war-room-notification", { "label": "War Room" }]
                ]
              }
            },
            {
              "type": "metric",
              "x": 16,
              "y": 6,
              "width": 8,
              "height": 6,
              "properties": {
                "title": "Oldest queued item age",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 60,
                "metrics": [
                  ["${WorkerMetricsNamespace}", "OldestQueuedAgeSeconds", "Environment", "${EnvironmentName}", "Worker", "inspection", { "label": "Inspection" }],
                  ["${WorkerMetricsNamespace}", "OldestQueuedAgeSeconds", "Environment", "${EnvironmentName}", "Worker", "monthly-portfolio-summary", { "label": "Monthly portfolio" }],
                  ["${WorkerMetricsNamespace}", "OldestQueuedAgeSeconds", "Environment", "${EnvironmentName}", "Worker", "war-room-notification", { "label": "War Room" }]
                ]
              }
            },
            {
              "type": "metric",
              "x": 0,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Stale worker leases",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 60,
                "metrics": [
                  ["${WorkerMetricsNamespace}", "StaleLeases", "Environment", "${EnvironmentName}", "Worker", "inspection", { "label": "Inspection" }],
                  ["${WorkerMetricsNamespace}", "StaleLeases", "Environment", "${EnvironmentName}", "Worker", "monthly-portfolio-summary", { "label": "Monthly portfolio" }],
                  ["${WorkerMetricsNamespace}", "StaleLeases", "Environment", "${EnvironmentName}", "Worker", "war-room-notification", { "label": "War Room" }]
                ]
              }
            },
            {
              "type": "metric",
              "x": 12,
              "y": 12,
              "width": 12,
              "height": 6,
              "properties": {
                "title": "Recent terminal failures",
                "region": "${AWS::Region}",
                "view": "timeSeries",
                "stat": "Maximum",
                "period": 60,
                "metrics": [
                  ["${WorkerMetricsNamespace}", "RecentFailures", "Environment", "${EnvironmentName}", "Worker", "inspection", { "label": "Inspection" }],
                  ["${WorkerMetricsNamespace}", "RecentFailures", "Environment", "${EnvironmentName}", "Worker", "monthly-portfolio-summary", { "label": "Monthly portfolio" }],
                  ["${WorkerMetricsNamespace}", "RecentFailures", "Environment", "${EnvironmentName}", "Worker", "war-room-notification", { "label": "War Room" }]
                ]
              }
            }
          ]
        }

Outputs:
  Canary:
    Description: CloudWatch Synthetics canary name
    Value: !Ref ApiHealthCanary
  AlertTopicArn:
    Description: SNS topic for production health alarms
    Value: !Ref HealthAlertTopic
  ArtifactsBucketName:
    Description: Retained S3 bucket for canary artifacts
    Value: !Ref CanaryArtifactsBucket
  DashboardName:
    Description: CloudWatch dashboard name
    Value: !Ref MonitoringDashboard
  WorkerMetricsNamespaceName:
    Description: Application namespace for worker and queue metrics
    Value: !Ref WorkerMetricsNamespace
